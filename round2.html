<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Round 2 - Base64 Corridor</title>

<style>
body{
background:#08111f;
color:white;
font-family:Segoe UI;
padding:40px;
text-align:center;
}

.card{
max-width:1000px;
margin:auto;
background:#122444;
padding:30px;
border-radius:20px;
}

.code{
font-size:28px;
color:#4fd7ff;
margin:30px 0;
word-break:break-all;
}

.door{
display:inline-block;
padding:20px;
margin:10px;
background:#1d355a;
border-radius:10px;
width:180px;
}
</style>
</head>

<body>

<div class="card">

<h1>🚪 ROUND 2 - THE CORRIDOR</h1>

<p>
Four doors stand before you.
Only one is correct.
</p>

<div class="code">
Rm9sbG93IHRoZSB3aGl0ZSByYWJiaXQu
</div>

<p>
Decode the message.
</p>

<input id="answer" style="width:80%;padding:15px;">
<br><br>

<button onclick="check()">Submit</button>

<div id="result"></div>

</div>

<script>

function check(){

let ans=document.getElementById('answer').value
.toLowerCase()
.trim();

if(ans==="follow the white rabbit."){

document.getElementById('result').innerHTML=
'<h2 style="color:#7cff8f">✅ Correct!</h2><a href="round3.html">Continue</a>';

}
else{

document.getElementById('result').innerHTML=
'<h2 style="color:#ff7f7f">❌ Not quite.</h2>';

}

}

</script>

</body>
</html>
